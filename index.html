<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMDB Stream Player</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: Tahoma, sans-serif; text-align: center; padding: 20px; }
        input, button { padding: 10px; margin: 5px; border-radius: 5px; border: none; font-size: 16px; }
        input { width: 60%; max-width: 300px; }
        button { background: #3b82f6; color: #fff; cursor: pointer; }
        video { width: 100%; max-width: 800px; height: 450px; background: #000; margin-top: 20px; border-radius: 10px; }
        .streams-list { margin: 15px 0; }
        .stream-btn { background: #10b981; margin: 3px; }
    </style>
</head>
<body>

    <h2>مشغل استعراض الروابط</h2>
    <div>
        <input type="text" id="tmdbId" placeholder="اكتب TMDB ID (مثلاً 893478)" value="893478">
        <button onclick="fetchStreams()">جلب الروابط</button>
    </div>

    <div class="streams-list" id="streamsList"></div>

    <div>
        <video id="videoPlayer" controls></video>
    </div>

    <script>
        async function fetchStreams() {
            const id = document.getElementById('tmdbId').value;
            const listDiv = document.getElementById('streamsList');
            listDiv.innerHTML = "جاري البحث عن الروابط...";
            
            try {
                // نطلب الروابط من السيرفر مالته على Netlify
                const res = await fetch(`/api/streams/series/${id}?season=1&episode=1`);
                const data = await res.json();
                
                listDiv.innerHTML = "";
                if(data.streams && data.streams.length > 0) {
                    data.streams.forEach(stream => {
                        const btn = document.createElement('button');
                        btn.className = 'stream-btn';
                        btn.innerText = `${stream.server} (${stream.quality || 'HD'})`;
                        btn.onclick = () => {
                            const player = document.getElementById('videoPlayer');
                            player.src = stream.url;
                            player.play();
                        };
                        listDiv.appendChild(btn);
                    });
                } else {
                    listDiv.innerHTML = "ماكو روابط متاحة حالياً لهذا الـ ID (قد يتطلب إعداد كوكيز المزودين).";
                }
            } catch (err) {
                listDiv.innerHTML = "حدث خطأ أثناء جلب الروابط.";
            }
        }
    </script>
</body>
</html>
