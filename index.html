<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Player</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe id="player" src="" allowfullscreen></iframe>
    <script>
        // دالة لسحب الـ ID من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const tmdbId = urlParams.get('id') || '893478'; // الافتراضي إذا ماكو ID
        
        // رابط المشغل الجاهز (يستخدم الـ ID اللي نمرره)
        const playerUrl = `https://vidlink.pro/tv/${tmdbId}/1/1`;
        document.getElementById('player').src = playerUrl;
    </script>
</body>
</html>
